name: club-lectura

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-club_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solo_demo_local}
      POSTGRES_DB: ${POSTGRES_DB:-club_lectura}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-club_demo}:${POSTGRES_PASSWORD:-solo_demo_local}@postgres:5432/${POSTGRES_DB:-club_lectura}?schema=public
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-Lector de prueba}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-lector@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-LecturaDemo123!}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
